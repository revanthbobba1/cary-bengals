name: ESPN full sync (daily)

# Manual trigger only. The scheduled run (8am ET Tue-Fri, waiver-driven daily refresh) is the
# Netlify scheduled function netlify/functions/espn-full-sync.mts -- GitHub's `schedule` trigger
# started it ~4.5 hours late (see docs/ESPN_INTEGRATION_PLAN.md's Phase 8c-cron notes). Kept so a
# commissioner can force a full refresh from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Same cold-start handling as espn-matchup-sync.yml -- see its comment for why this lives
      # in the workflow and not the Route Handler.
      - name: Wake the ESPN backend
        run: curl -sf --max-time 70 "${{ secrets.ESPN_SERVICE_URL }}/healthz" || true

      - name: Full ESPN refresh (names, rosters, records, matchups)
        run: |
          # No -f: with it curl exits 22 on any HTTP error and discards the body, which hides
          # the handler's JSON error message. Print the body, then fail on a non-2xx status
          # (000 = curl itself failed, e.g. timeout, so there may be no body).
          status=$(curl -s --max-time 20 -o response.json -w '%{http_code}' -X POST "${{ secrets.ESPN_SYNC_ALL_URL }}" \
            -H "x-cron-secret: ${{ secrets.ESPN_SYNC_CRON_SECRET }}") || status=000
          echo "HTTP $status"
          cat response.json 2>/dev/null || true
          echo
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]
