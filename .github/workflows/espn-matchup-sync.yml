name: ESPN matchup sync (live windows)

# Manual trigger only. The scheduled run (every 10 minutes across the live NFL game windows) is
# the Netlify scheduled function netlify/functions/espn-matchup-sync.mts -- GitHub's `schedule`
# trigger proved too unreliable for it (see docs/ESPN_INTEGRATION_PLAN.md's Phase 8c-cron notes).
# Kept so a commissioner can force a matchup sync from the Actions tab.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Absorbs a cold Render instance (free tier, up to ~60s after 15min idle) here, not inside
      # the Route Handler -- that handler is bound by Netlify's sync-function timeout and can't
      # run a retry-with-backoff loop. `|| true` means a slow/failed wake-up ping doesn't abort
      # the job; the real sync call below still runs against a (by then) warm backend.
      - name: Wake the ESPN backend
        run: curl -sf --max-time 70 "${{ secrets.ESPN_SERVICE_URL }}/healthz" || true

      - name: Sync matchups
        run: |
          # No -f: with it curl exits 22 on any HTTP error and discards the body, which hides
          # the handler's JSON error message. Print the body, then fail on a non-2xx status
          # (000 = curl itself failed, e.g. timeout, so there may be no body).
          status=$(curl -s --max-time 20 -o response.json -w '%{http_code}' -X POST "${{ secrets.ESPN_SYNC_URL }}" \
            -H "x-cron-secret: ${{ secrets.ESPN_SYNC_CRON_SECRET }}") || status=000
          echo "HTTP $status"
          cat response.json 2>/dev/null || true
          echo
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]
