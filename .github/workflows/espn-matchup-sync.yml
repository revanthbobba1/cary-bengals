name: ESPN matchup sync (live windows)

# Live-feeling scores during actual NFL games -- every 10 minutes across the four real game
# windows, translated from their ET kickoff times to the UTC cron needs. See
# docs/ESPN_INTEGRATION_PLAN.md's Phase 8c-cron notes for why these four windows (not five, and
# not a single always-on schedule).
on:
  schedule:
    - cron: '*/10 0-4 * * 5' # Thu Night Football: Thu 8pm-12:59am ET
    - cron: '*/10 17-23 * * 0' # Sun early/late afternoon games: Sun 1pm-7:59pm ET
    - cron: '*/10 0-5 * * 1' # Sun Night Football: Sun 8pm-1:59am ET (lands on Monday's UTC date)
    - cron: '*/10 0-4 * * 2' # Mon Night Football: Mon 8pm-12:59am ET (lands on Tuesday's UTC date)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Absorbs a cold Render instance (free tier, up to ~60s after 15min idle) here, not inside
      # the Route Handler -- that handler is bound by Netlify's sync-function timeout and can't
      # run a retry-with-backoff loop. `|| true` means a slow/failed wake-up ping doesn't abort
      # the job; the real sync call below still runs against a (by then) warm backend.
      - name: Wake the ESPN backend
        run: curl -sf --max-time 70 "${{ secrets.ESPN_SERVICE_URL }}/healthz" || true

      - name: Sync matchups
        run: |
          curl -sf --max-time 20 -X POST "${{ secrets.ESPN_SYNC_URL }}" \
            -H "x-cron-secret: ${{ secrets.ESPN_SYNC_CRON_SECRET }}"
