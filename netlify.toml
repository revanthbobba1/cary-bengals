[build]
  # Build command
  command = "yarn build"
  
  # Node.js version
  [build.environment]
    NODE_VERSION = "18"
    YARN_VERSION = "3.6.1"

# `develop` is a branch-deploy branch only so PRs into it get Deploy Previews. Skip the
# branch-deploy build itself (exit 0 = cancel) so pushes to `develop` don't publish a site;
# only `main` builds production. Deploy Previews use a different context and still build.
[context.branch-deploy]
  ignore = "exit 0"

# Netlify Next.js plugin (required for Next.js runtime support)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    