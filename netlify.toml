[build]
  # Build command
  command = "yarn build"
  
  # Directory to publish (Netlify Next.js plugin handles this automatically)
  publish = ".next"
  
  # Node.js version
  [build.environment]
    NODE_VERSION = "18"
    # NPM_FLAGS = "--version"   # removed — printing npm version can interrupt the build
    YARN_VERSION = "3.6.1"

# Netlify Next.js plugin (required for Next.js runtime support)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Functions (if you have any)
[functions]
  directory = "netlify/functions"