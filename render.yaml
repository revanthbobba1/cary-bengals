# Render Blueprint for the ESPN sync service (backend/). See
# docs/ESPN_INTEGRATION_PLAN.md §2.6 for why Render: Netlify can't host a long-running Python
# process, and this service's only caller is a commissioner-triggered sync a few times a season,
# so the free tier's cold start is an acceptable tradeoff.
#
# Deploy via Render's dashboard: New -> Blueprint -> select this repo. Render reads this file and
# provisions the service below; ESPN_S2/ESPN_SWID are marked `sync: false` so Render prompts for
# them interactively instead of ever reading them from this (committed, public-readable-by-
# collaborators) file. SERVICE_TOKEN is auto-generated by Render -- copy its value from the
# Render dashboard into the Next.js app's ESPN_SERVICE_TOKEN (Netlify env vars) after first
# deploy, and set ESPN_SERVICE_URL there to this service's Render URL.
services:
  - type: web
    name: cary-bengals-espn-service
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ESPN_LEAGUE_ID
        value: '19467081'
      - key: ESPN_S2
        sync: false
      - key: ESPN_SWID
        sync: false
      - key: SERVICE_TOKEN
        generateValue: true
      - key: CACHE_TTL_SECONDS
        value: '900'
